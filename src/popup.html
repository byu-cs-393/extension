<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CS 393 Buddy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">CS 393 Buddy</div>
      <div class="sync-status">
        <span class="sync-check" aria-hidden="true">✓</span>
        <span>synced</span>
      </div>
    </header>

    <section class="week">
      <div class="week-label" id="popup-week-label">This week</div>

      <article class="card">
        <div class="card-title">Recommended problems</div>
        <div class="progress">
          <div
            class="progress-bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="7"
            aria-valuenow="0"
            id="popup-progress-bar"
          >
            <div class="progress-fill" id="popup-progress-fill"></div>
          </div>
          <div class="progress-text" id="popup-progress-text">— / 7</div>
        </div>
        <div class="card-detail" id="popup-detail">Visit leetcode.com to sync progress.</div>
        <button type="button" class="btn-primary" id="popup-next-btn" hidden>Next problem →</button>
      </article>

      <article class="card">
        <div class="card-title">Topic Exam · Hash Maps</div>
        <div class="card-warning">
          <span class="warning-icon" aria-hidden="true">⚠</span>
          <span>Due Wed</span>
        </div>
        <button type="button" class="btn-primary">Request signoff</button>
      </article>
    </section>

    <div class="dashboard-link">
      <button type="button" id="open-dashboard" class="btn-secondary">Open full dashboard →</button>
    </div>

    <footer class="footer">
      <a href="#" role="button">⚙ Settings</a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a href="#" role="button">🔒 Your data</a>
      <span class="footer-sep" aria-hidden="true">·</span>
      <a href="#" role="button">🏆 Compete</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
