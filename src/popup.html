<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CS 393 Buddy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">CS 393 Buddy</div>
      <div class="sync-status" id="popup-sync-status">
        <span class="sync-check" aria-hidden="true">✓</span>
        <span>synced</span>
      </div>
    </header>

    <!-- Pre-onboarding state: compact welcome + Continue setup button.
         Hidden by default; popup.js toggles based on whether a netID is
         on file in chrome.storage.sync. -->
    <section id="popup-welcome" class="welcome" hidden>
      <h1 class="welcome-title">Welcome!</h1>
      <p class="welcome-copy">
        CS 393 Buddy tracks your weekly LeetCode work, submits it to
        Canvas for you, and lets you request signoffs from a TA.
      </p>
      <p class="welcome-copy welcome-note">
        Setup takes about 2 minutes.
      </p>
      <button type="button" class="btn-primary" id="continue-setup-btn">
        Continue setup →
      </button>
    </section>

    <!-- Onboarded state: current-week status. -->
    <section id="popup-onboarded" class="week" hidden>
      <div class="week-label" id="popup-week-label">This week</div>

      <article class="card">
        <div class="card-title">Recommended problems</div>
        <div class="progress">
          <div
            class="progress-bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="0"
            aria-valuenow="0"
            id="popup-progress-bar"
          >
            <div class="progress-fill" id="popup-progress-fill"></div>
          </div>
          <div class="progress-text" id="popup-progress-text">— / —</div>
        </div>
        <div class="card-detail" id="popup-detail">Visit leetcode.com to sync progress.</div>
        <button type="button" class="btn-primary" id="popup-next-btn" hidden>Next problem →</button>
      </article>

      <!-- This week's assessments, filled by popup.js from course.json.
           Hidden when the week has none. -->
      <article class="card" id="popup-assessments" hidden>
        <div class="card-title">This week</div>
        <ul class="card-list" id="popup-assessment-list"></ul>
      </article>

      <div class="dashboard-link">
        <button type="button" id="open-dashboard" class="btn-secondary">Open full dashboard →</button>
      </div>
    </section>

    <!-- Settings and Compete used to live here as dead links to features
         that don't exist. What's left is real: what the extension records
         and who can see it. -->
    <footer class="footer" id="popup-footer" hidden>
      <a
        href="https://cs393-496021.web.app/privacy.html"
        target="_blank"
        rel="noopener noreferrer"
        >🔒 What this records</a
      >
    </footer>

    <script type="module" src="pages/popup.js"></script>
  </body>
</html>
