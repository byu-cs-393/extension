<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CS 393 Buddy · TA Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="ta-dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div class="brand-block">
          <span class="brand">CS 393 Buddy</span>
          <span class="separator" aria-hidden="true">·</span>
          <span class="term">TA Dashboard</span>
        </div>
        <div class="actions">
          <button class="header-btn" id="back-to-student-btn">← Student view</button>
        </div>
      </header>

      <main>
        <nav class="ta-nav">
          <button class="ta-nav-btn active" data-view="signoffs">Signoff queue</button>
          <button class="ta-nav-btn" data-view="students">Students</button>
        </nav>

        <!-- Signoff queue view -->
        <section class="ta-view" data-view="signoffs">
          <h1>Pending signoff requests</h1>
          <div id="signoff-list" class="signoff-list">
            <p class="ta-empty">Loading…</p>
          </div>
        </section>

        <!-- Students list view -->
        <section class="ta-view" data-view="students" hidden>
          <h1>Students</h1>
          <div class="struggling-controls">
            <label for="struggling-sort">Sort by</label>
            <select id="struggling-sort" class="struggling-sort">
              <option value="inactive" selected>Least recent activity (default)</option>
              <option value="currentWeek">Fewest solves this week</option>
              <option value="overall">Lowest overall completion</option>
              <option value="visits">Fewest visits</option>
              <option value="name">Name (A–Z)</option>
              <option value="risk">Risk score (composite)</option>
            </select>
          </div>
          <p class="ta-help">Click any row to see that student's per-week breakdown.</p>
          <div id="struggling-list" class="struggling-list">
            <p class="ta-empty">Loading…</p>
          </div>
        </section>

        <!-- Student detail view — child of Students, not a top-level nav item -->
        <section class="ta-view" data-view="student" hidden>
          <button type="button" class="student-back-btn" id="student-back-btn">
            ← Back to Students
          </button>
          <div id="student-detail-header"></div>
          <div id="student-detail-body"></div>
        </section>
      </main>
    </div>

    <script type="module" src="pages/ta-dashboard.js"></script>
  </body>
</html>
