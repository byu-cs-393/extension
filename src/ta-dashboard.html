<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CS 393 Buddy · TA Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="ta-dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div class="brand-block">
          <span class="brand">CS 393 Buddy</span>
          <span class="separator" aria-hidden="true">·</span>
          <span class="term">TA Dashboard</span>
        </div>
        <div class="actions">
          <button class="header-btn" id="back-to-student-btn">← Student view</button>
        </div>
      </header>

      <main>
        <nav class="ta-nav">
          <button class="ta-nav-btn active" data-view="signoffs">Signoff queue</button>
          <button class="ta-nav-btn" data-view="struggling">Struggling students</button>
          <button class="ta-nav-btn" data-view="student">Student detail</button>
        </nav>

        <!-- Signoff queue view -->
        <section class="ta-view" data-view="signoffs">
          <h1>Pending signoff requests</h1>
          <div id="signoff-list" class="signoff-list">
            <p class="ta-empty">Loading…</p>
          </div>
        </section>

        <!-- Struggling students view -->
        <section class="ta-view" data-view="struggling" hidden>
          <h1>Students</h1>
          <div class="struggling-controls">
            <label for="struggling-sort">Sort by</label>
            <select id="struggling-sort" class="struggling-sort">
              <option value="risk">Risk score (default)</option>
              <option value="inactive">Least recent activity</option>
              <option value="currentWeek">Fewest solves this week</option>
              <option value="overall">Lowest overall completion</option>
              <option value="visits">Fewest visits</option>
              <option value="name">Name (A–Z)</option>
            </select>
          </div>
          <p class="ta-help">Click any row to see that student's per-week breakdown.</p>
          <div id="struggling-list" class="struggling-list">
            <p class="ta-empty">Loading…</p>
          </div>
        </section>

        <!-- Student detail view -->
        <section class="ta-view" data-view="student" hidden>
          <div id="student-detail-header">
            <p class="ta-empty">
              Pick a student from
              <a href="#" class="link-to-struggling">Struggling students</a>
              to see their details.
            </p>
          </div>
          <div id="student-detail-body"></div>
        </section>
      </main>
    </div>

    <script type="module" src="ta-dashboard.js"></script>
  </body>
</html>
