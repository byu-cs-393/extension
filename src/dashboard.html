<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CS 393 Buddy · Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dashboard-header">
        <div class="brand-block">
          <span class="brand">CS 393 Buddy</span>
          <span class="separator" aria-hidden="true">·</span>
          <span class="term">Spring 2026</span>
          <span class="sync-status">
            <span class="sync-check" aria-hidden="true">✓</span>
            <span>synced</span>
          </span>
        </div>
        <div class="actions">
          <button class="header-btn">🏆 Compete</button>
          <div class="profile-menu">
            <button
              class="header-btn icon-only"
              id="profile-button"
              title="Profile"
              aria-haspopup="true"
              aria-expanded="false"
            >👤</button>
            <div class="profile-dropdown" id="profile-dropdown" role="menu" hidden>
              <button type="button" class="dropdown-item" id="sign-out-btn" role="menuitem">
                Sign out
              </button>
            </div>
          </div>
          <button class="header-btn icon-only" title="Settings">⚙</button>
        </div>
      </header>

      <main>
        <div class="greeting">Hi, <span id="student-name">…</span></div>

        <div id="weeks-container" class="weeks-container">
          <p id="weeks-empty" class="weeks-empty">Loading weeks…</p>
        </div>

        <div class="more-hint" aria-hidden="true">⋮ scroll for earlier weeks ⋮</div>
      </main>
    </div>

    <script type="module" src="dashboard.js"></script>
  </body>
</html>
